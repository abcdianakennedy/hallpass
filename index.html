  /* Palette read off sunshinestateacademy.com on 2026-08-18: slate #2a353c,
     page wash #eef2f6, sage #a7beb1 (the Apply button), tan #dbb6a1 (Schedule
     A Tour), cream #f5f1e3. Type is Poppins, the site's own face. */
  :root{
    --bg:#eef2f6; --card:#ffffff; --ink:#1f2937; --muted:#71808d;
    --line:#dde5ec; --blue:#2a353c; --blue-soft:#e7edf1;
    --sage:#a7beb1; --sage-soft:#e9f0eb; --sage-ink:#4f6b59;
    --tan:#dbb6a1; --tan-soft:#f7ece5; --cream:#f5f1e3;
    --amber:#d99b2b; --amber-soft:#fbf0da; --red:#b8433c; --red-soft:#f9e6e4;
    --radius:16px;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.45 "Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-text-size-adjust:100%; overscroll-behavior:none;
  }
  button{font:inherit; color:inherit; border:0; background:none; cursor:pointer}
  input,select,textarea{font:inherit; color:inherit}
  .hide{display:none !important}

  /* ---------- app frame ---------- */
  #app{display:flex; flex-direction:column; min-height:100%}
  header{
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:calc(10px + var(--safe-t)) 16px 10px; background:var(--card);
    border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;
  }
  header .title{font-size:19px; font-weight:600; letter-spacing:-.01em}
  #hLogo{height:38px; width:auto; flex:none}
  header .sub{font-size:13px; color:var(--muted)}
  .classbtn{display:flex; align-items:center; gap:7px; padding:0; text-align:left}
  .classbtn .caret{
    font-size:12px; color:var(--muted); background:var(--blue-soft); color:var(--blue);
    border-radius:8px; padding:2px 7px; line-height:1.2; font-weight:700;
  }
  .classrow{
    display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:14px 14px; border-radius:14px; background:var(--blue-soft);
    margin-bottom:10px;
  }
  .classrow .nm{font-weight:650; font-size:17px}
  .classrow .meta{font-size:13px; color:var(--muted)}
  .classrow.on{background:var(--sage-soft); box-shadow:inset 0 0 0 2px var(--sage)}
  .classrow .tick{margin-left:auto; color:var(--sage-ink); font-weight:700; font-size:14px}
  .classline{
    display:flex; align-items:center; gap:10px; padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .classline:last-of-type{border-bottom:0}
  .classline .grow{flex:1; min-width:0}
  .classline .nm{font-weight:650}
  .note{
    margin-top:10px; padding:10px 12px; background:var(--cream); border-radius:10px;
    font-size:13px; line-height:1.5; color:#5c5342;
  }
  header .spacer{flex:1}
  .pill{
    display:inline-flex; align-items:center; gap:6px; padding:5px 11px;
    border-radius:999px; font-size:13px; font-weight:600; background:var(--blue-soft);
    color:var(--blue);
  }
  .pill.warn{background:var(--amber-soft); color:#8a5a06}
  .btn{
    padding:10px 16px; border-radius:12px; font-weight:600; font-size:15px;
    background:var(--blue-soft); color:var(--blue);
  }
  .btn.primary{background:var(--blue); color:#fff}
  .btn.ghost{background:transparent; color:var(--muted); border:1px solid var(--line)}
  .btn.danger{background:var(--red-soft); color:var(--red)}
  .btn:active{transform:translateY(1px)}
  .btn[disabled]{opacity:.4}

  main{flex:1; padding:16px 16px calc(24px + var(--safe-b))}

  /* ---------- board ---------- */
  #grid{
    display:grid; gap:12px;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  }
  .tile{
    background:var(--card); border:1.5px solid var(--line); border-radius:var(--radius);
    padding:16px 14px; min-height:104px; display:flex; flex-direction:column;
    justify-content:space-between; text-align:left; transition:background .12s,border-color .12s;
  }
  .tile .nm{font-size:19px; font-weight:650; line-height:1.2; letter-spacing:-.01em}
  .tile .st{font-size:13px; color:var(--muted); margin-top:8px}
  .tile.out{background:var(--amber-soft); border-color:var(--amber)}
  .tile.out .st{color:#8a5a06; font-weight:650}
  .tile.over{background:var(--red-soft); border-color:var(--red)}
  .tile.over .st{color:var(--red)}
  .tile .timer{font-variant-numeric:tabular-nums; font-size:22px; font-weight:700}
  .tile.blocked{opacity:.45}
  .empty{color:var(--muted); text-align:center; padding:56px 20px}

  /* ---------- undo bar ---------- */
  #undo{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(18px + var(--safe-b)); z-index:40;
    background:#16202e; color:#fff; border-radius:14px; padding:11px 14px;
    display:flex; align-items:center; gap:14px; font-size:14px;
    box-shadow:0 8px 26px rgba(0,0,0,.22); max-width:92vw;
  }
  #undo button{color:#ffd48a; font-weight:700}

  /* ---------- sheets / modals ---------- */
  .scrim{
    position:fixed; inset:0; background:rgba(16,22,30,.45); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:18px;
  }
  .sheet{
    background:var(--card); border-radius:20px; width:100%; max-width:520px;
    max-height:88vh; overflow:auto; padding:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
  }
  .sheet h2{margin:0 0 4px; font-size:20px}
  .sheet p.note{margin:0 0 16px; color:var(--muted); font-size:14px}
  .destgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px}
  .destgrid button{
    background:var(--blue-soft); color:var(--blue); border-radius:14px;
    padding:18px 10px; font-weight:650; font-size:17px;
  }

  /* ---------- forms ---------- */
  label.field{display:block; margin:0 0 14px}
  label.field span{display:block; font-size:13px; font-weight:650; color:var(--muted); margin-bottom:5px}
  input[type=text],input[type=number],input[type=tel],textarea,select{
    width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:12px;
    background:#fff;
  }
  textarea{min-height:190px; resize:vertical; line-height:1.6}
  .row{display:flex; gap:10px; flex-wrap:wrap}
  .row > *{flex:1}
  .switch{display:flex; align-items:center; gap:10px; margin-bottom:14px}
  .switch input{width:22px; height:22px; flex:none}
  .switch span{font-size:15px}

  /* ---------- teacher screens ---------- */
  .tabs{display:flex; gap:6px; padding:0 16px 12px; background:var(--card); border-bottom:1px solid var(--line); overflow:auto}
  .tabs button{padding:9px 14px; border-radius:10px; font-weight:650; font-size:14px; color:var(--muted); white-space:nowrap}
  .tabs button.on{background:var(--blue-soft); color:var(--blue)}
  .cards{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); margin-bottom:18px}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px}
  .stat .k{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700}
  .stat .v{font-size:26px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums}
  .panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; margin-bottom:16px}
  .panel h3{margin:0 0 12px; font-size:15px}
  table{width:100%; border-collapse:collapse; font-size:14px}
  th,td{text-align:left; padding:9px 6px; border-bottom:1px solid var(--line)}
  th{font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted)}
  td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:0}
  .bar{height:9px; border-radius:5px; background:var(--blue); min-width:3px}
  .barwrap{background:var(--blue-soft); border-radius:5px}
  .flag{color:var(--red); font-weight:700}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:14px}
  .keypad button{background:var(--blue-soft); color:var(--blue); border-radius:14px; padding:16px; font-size:21px; font-weight:650}
  .dots{display:flex; gap:12px; justify-content:center; margin:16px 0 4px}
  .dots i{width:14px; height:14px; border-radius:50%; background:var(--line)}
  .dots i.on{background:var(--blue)}
  #toast{
    position:fixed; left:50%; transform:translateX(-50%); top:calc(14px + var(--safe-t));
    background:#16202e; color:#fff; padding:11px 16px; border-radius:12px; z-index:60;
    font-size:14px; box-shadow:0 8px 26px rgba(0,0,0,.2);
  }
  @media (max-width:520px){
    #grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
    .tile{min-height:92px; padding:13px 12px}
    .tile .nm{font-size:17px}
  }
  @media print{ body{background:#fff} header,.tabs,.btn{display:none} }
</style>
</head>

<script>
/* Boot guard. Everything on this page is drawn by JS into <main>, so an
   uncaught error used to show as a blank white page with no way to tell why.
   This paints the error where the app would have been. */
(function () {
  function paint(msg) {
    var m = document.getElementById('main');
    if (!m) return;
    m.innerHTML = '<div style="max-width:640px;margin:40px auto;padding:20px 22px;'
      + 'background:#fff;border:1px solid #e2e6ea;border-radius:14px;'
      + 'font:15px/1.5 system-ui,sans-serif;color:#2a353c">'
      + '<div style="font-weight:700;margin-bottom:8px">Hall Pass could not start</div>'
      + '<div style="margin-bottom:10px">Send this line to whoever set the app up:</div>'
      + '<div style="font:13px/1.4 ui-monospace,Menlo,monospace;background:#f3f5f7;'
      + 'padding:10px;border-radius:8px;word-break:break-word">'
      + String(msg).replace(/[&<>]/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; })
      + '</div></div>';
  }
  window.addEventListener('error', function (e) {
    paint((e.message || 'error') + ' @ line ' + (e.lineno || '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    paint('unhandled promise: ' + (e.reason && e.reason.message || e.reason));
  });
  window.addEventListener('load', function () {
    var m = document.getElementById('main');
    if (m && !m.innerHTML.trim()) {
      paint('the page loaded but nothing was drawn - the script did not run');
    }
  });
})();
</script>
<script>
/* Hall Pass - core logic.
   Pure functions plus a thin localStorage wrapper. No network, ever.
   Loaded directly by selftest.html and inlined into the distributed file. */

var HP = (function () {
  var KEY = 'hallpass.v1';   // storage key kept from v1 so old data migrates in place
  var VERSION = 2;

  /* Fields that belong to the iPad, not to one class. A teacher who moves
     between rooms keeps one PIN, one set of rules, one school name. */
  var SHARED = ['schoolName', 'teacher', 'pin', 'maxOut', 'longTripMin',
                'useDest', 'destinations', 'setup'];

  function uid() {
    return Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
  }

  function blankStore() {
    return {
      version: VERSION,
      setup: false,
      schoolName: 'Sunshine State Academy',
      teacher: '',
      pin: '',              // 4 digits, gates teacher screens
      maxOut: 2,            // 0 = unlimited
      useDest: false,
      destinations: ['Bathroom', 'Water', 'Nurse', 'Office'],
      longTripMin: 10,      // flag a trip past this many minutes
      activeId: '',
      classes: []           // [{id, name, roster:[{id,name}], trips:[]}]
    };
  }

  function blankClass(name) {
    return { id: uid(), name: name || '', roster: [], trips: [] };
  }

  /* A single flat object shaped like the old v1 state, so every screen and
     every report below can stay class-agnostic. roster/trips are the SAME
     array references the store holds. */
  function blankState() {
    var v = {};
    var b = blankStore();
    SHARED.forEach(function (k) { v[k] = b[k]; });
    v.version = VERSION;
    v.classId = '';
    v.className = '';
    v.roster = [];
    v.trips = [];
    return v;
  }

  function migrate(s) {
    var base = blankStore();
    if (!s || typeof s !== 'object') return base;

    if (!s.version || s.version < 2) {          // v1: one flat class
      var st = blankStore();
      SHARED.forEach(function (k) { if (s[k] !== undefined) st[k] = s[k]; });
      var c = blankClass(s.className || '');
      c.roster = s.roster || [];
      c.trips = s.trips || [];
      st.classes = [c];
      st.activeId = c.id;
      return st;
    }

    Object.keys(base).forEach(function (k) {
      if (s[k] === undefined) s[k] = base[k];
    });
    if (!Array.isArray(s.classes) || !s.classes.length) {
      var only = blankClass('');
      s.classes = [only];
      s.activeId = only.id;
    }
    s.classes.forEach(function (k) {
      if (!k.id) k.id = uid();
      if (!Array.isArray(k.roster)) k.roster = [];
      if (!Array.isArray(k.trips)) k.trips = [];
      k.name = k.name || '';
    });
    if (!classById(s, s.activeId)) s.activeId = s.classes[0].id;
    s.version = VERSION;
    return s;
  }

  function classById(store, id) {
    var hit = (store.classes || []).filter(function (c) { return c.id === id; });
    return hit.length ? hit[0] : null;
  }

  function activeClass(store) {
    return classById(store, store.activeId) || store.classes[0];
  }

  /* store -> the flat per-class state every screen works on */
  function viewOf(store) {
    var v = {};
    SHARED.forEach(function (k) { v[k] = store[k]; });
    var c = activeClass(store) || blankClass('');
    v.version = store.version;
    v.classId = c.id;
    v.className = c.name;
    v.roster = c.roster;
    v.trips = c.trips;
    return v;
  }

  /* flat state -> back into the store, before saving */
  function commit(store, view) {
    SHARED.forEach(function (k) { store[k] = view[k]; });
    var c = classById(store, view.classId) || activeClass(store);
    if (!c) return store;
    c.name = view.className;
    c.roster = view.roster;
    c.trips = view.trips;
    return store;
  }

  function addClass(store, name, roster) {
    var c = blankClass(name);
    c.roster = roster || [];
    store.classes.push(c);
    store.activeId = c.id;
    return c;
  }

  function removeClass(store, id) {
    if (store.classes.length <= 1) return false;
    store.classes = store.classes.filter(function (c) { return c.id !== id; });
    if (!classById(store, store.activeId)) store.activeId = store.classes[0].id;
    return true;
  }

  function switchClass(store, id) {
    if (!classById(store, id)) return false;
    store.activeId = id;
    return true;
  }

  /* how many students are out right now, per class - shown in the switcher */
  function openCount(cls) {
    return (cls.trips || []).filter(function (t) { return !t['in']; }).length;
  }

  /* Storage that cannot throw.

     Safari raises SecurityError on the *property access* window.localStorage
     when storage is blocked - which happens for a page opened from a file://
     URL with cross-site tracking prevention on. That access used to sit
     outside the try/catch, so it killed the boot and left a blank page.
     Now it is guarded, and a page that cannot persist still runs (in memory)
     and can say so instead of showing nothing. */

  var memStore = (function () {
    var m = {};
    return {
      getItem: function (k) { return Object.prototype.hasOwnProperty.call(m, k) ? m[k] : null; },
      setItem: function (k, v) { m[k] = String(v); },
      removeItem: function (k) { delete m[k]; },
      volatile: true
    };
  })();

  function defaultStore() {
    try {
      var ls = window.localStorage;
      var probe = '__hp_probe__';
      ls.setItem(probe, '1');
      ls.removeItem(probe);
      return ls;
    } catch (e) {
      return memStore;
    }
  }

  function persistent() {
    return defaultStore() !== memStore;
  }

  function load(store) {
    try {
      store = store || defaultStore();
      var raw = store.getItem(KEY);
      if (!raw) return migrate(blankStore());
      return migrate(JSON.parse(raw));
    } catch (e) {
      return migrate(blankStore());
    }
  }

  function save(state, store) {
    try {
      store = store || defaultStore();
      store.setItem(KEY, JSON.stringify(state));
      return true;
    } catch (e) {
      return false;
    }
  }

  /* ---------- roster ---------- */

  function parseRoster(text) {
    var seen = {};
    return String(text || '')
      .split(/[\n,]/)
      .map(function (n) { return n.replace(/\s+/g, ' ').trim(); })
      .filter(function (n) {
        if (!n) return false;
        var k = n.toLowerCase();
        if (seen[k]) return false;
        seen[k] = 1;
        return true;
      })
      .map(function (n) { return { id: uid(), name: n }; });
  }

  /* Keep ids stable for names that survive an edit, so history stays attached. */
  function mergeRoster(oldRoster, text) {
    var byName = {};
    (oldRoster || []).forEach(function (s) { byName[s.name.toLowerCase()] = s; });
    return parseRoster(text).map(function (s) {
      var prev = byName[s.name.toLowerCase()];
      return prev ? { id: prev.id, name: s.name } : s;
    });
  }

  function rosterText(roster) {
    return (roster || []).map(function (s) { return s.name; }).join('\n');
  }

  /* ---------- roster from a spreadsheet ----------

     Takes whatever a teacher exports or pastes - CSV from Excel or Google
     Sheets, a tab-separated paste straight out of a spreadsheet, or a plain
     list - and works out which column holds the names. Nothing is applied
     silently: the caller drops the result in the roster box for review. */

  function splitLines(text) {
    return String(text || '')
      .replace(/^﻿/, '')
      .replace(/\r\n?/g, '\n')
      .split('\n');
  }

  function splitCells(line, delim) {
    if (!delim) return [line];
    var out = [], cur = '', q = false, i;
    for (i = 0; i < line.length; i++) {
      var ch = line.charAt(i);
      if (q) {
        if (ch === '"') {
          if (line.charAt(i + 1) === '"') { cur += '"'; i++; }
          else q = false;
        } else cur += ch;
      } else if (ch === '"') {
        q = true;
      } else if (ch === delim) {
        out.push(cur); cur = '';
      } else cur += ch;
    }
    out.push(cur);
    return out.map(function (c) { return c.replace(/\s+/g, ' ').trim(); });
  }

  function detectDelim(lines) {
    var best = null, bestScore = 0;
    ['\t', ',', ';', '|'].forEach(function (d) {
      var counts = lines.map(function (l) { return splitCells(l, d).length; });
      var maxN = counts.reduce(function (a, b) { return Math.max(a, b); }, 1);
      if (maxN < 2) return;
      var agree = counts.filter(function (n) { return n === maxN; }).length;
      var score = agree * maxN;
      if (score > bestScore) { bestScore = score; best = d; }
    });
    return best;
  }

  function looksLikeName(s) {
    if (!s) return false;
    if (s.length > 48) return false;
    if (/@/.test(s)) return false;                 // email
    if (/^[\d\W_]+$/.test(s)) return false;        // ids, numbers, dates
    if (/^\d/.test(s)) return false;
    return /[A-Za-zÀ-ɏ]{2}/.test(s);
  }

  var HEAD_FULL = /^(student|students|full ?name|name|pupil|learner|child)\b/i;
  var HEAD_FIRST = /^(first|given|forename)/i;
  var HEAD_LAST = /^(last|sur ?name|family)/i;

  /* A header row that no keyword matched still reads as a header: it is the
     one-word label above a column of full names ("Naam", "Alumno", "Roll").
     Drop it on the label vocabulary, or on that shape. */
  var HEAD_WORD = /^(students?|names?|full ?name|pupils?|learners?|child(ren)?|first|last|sur ?name|given|family|naam|leerling|nombre|alumnos?|eleve|schueler|roll|list)$/i;

  function dropHeaderName(names) {
    if (names.length < 2) return names;
    var first = names[0];
    if (HEAD_WORD.test(first)) return names.slice(1);
    if (!/ /.test(first)) {
      var rest = names.slice(1);
      var spaced = rest.filter(function (n) { return / /.test(n); }).length;
      if (spaced >= rest.length * 0.6) return names.slice(1);
    }
    return names;
  }

  function namesFromTable(text) {
    var lines = splitLines(text).filter(function (l) { return l.trim() !== ''; });
    if (!lines.length) return [];
    var delim = detectDelim(lines);
    var rows = lines.map(function (l) { return splitCells(l, delim); });

    if (!delim) {
      return dropHeaderName(dedupe(
        rows.map(function (r) { return r[0].replace(/\s+/g, ' ').trim(); })
          .filter(looksLikeName)));
    }

    var head = rows[0], iFull = -1, iFirst = -1, iLast = -1, k;
    for (k = 0; k < head.length; k++) {
      if (iFull < 0 && HEAD_FULL.test(head[k])) iFull = k;
      if (iFirst < 0 && HEAD_FIRST.test(head[k])) iFirst = k;
      if (iLast < 0 && HEAD_LAST.test(head[k])) iLast = k;
    }
    var hasHeader = (iFirst >= 0 && iLast >= 0) || iFull >= 0;
    var body = rows.slice(hasHeader ? 1 : 0);

    var pick;
    if (hasHeader && iFirst >= 0 && iLast >= 0) {
      pick = function (r) { return ((r[iFirst] || '') + ' ' + (r[iLast] || '')).trim(); };
    } else if (hasHeader && iFull >= 0) {
      pick = function (r) { return r[iFull] || ''; };
    } else {
      // no usable header: score every column, prefer full names over fragments
      var cols = body.reduce(function (a, r) { return Math.max(a, r.length); }, 0);
      var scores = [];
      for (k = 0; k < cols; k++) {
        var hits = 0, spaced = 0;
        body.forEach(function (r) {
          var c = r[k] || '';
          if (looksLikeName(c)) { hits++; if (/ /.test(c)) spaced++; }
        });
        scores.push({ i: k, hits: hits, spaced: spaced });
      }
      var nameCols = scores.filter(function (s) { return s.hits >= body.length * 0.6 && s.hits; });
      var whole = nameCols.filter(function (s) { return s.spaced >= s.hits * 0.6; });
      if (whole.length) {
        var w = whole[0];
        pick = function (r) { return r[w.i] || ''; };
      } else if (nameCols.length >= 2) {        // first, last in two columns
        var a = nameCols[0].i, b = nameCols[1].i;
        pick = function (r) { return ((r[a] || '') + ' ' + (r[b] || '')).trim(); };
      } else if (nameCols.length === 1) {
        var o = nameCols[0].i;
        pick = function (r) { return r[o] || ''; };
      } else {
        pick = function (r) { return r[0] || ''; };
      }
    }

    var names = dedupe(body.map(pick)
      .map(function (n) { return n.replace(/\s+/g, ' ').trim(); })
      .filter(looksLikeName));
    return hasHeader ? names : dropHeaderName(names);
  }

  function dedupe(names) {
    var seen = {};
    return names.filter(function (n) {
      var k = n.toLowerCase();
      if (seen[k]) return false;
      seen[k] = 1;
      return true;
    });
  }

  /* ---------- trips ---------- */

  function activeTrips(state) {
    return state.trips.filter(function (t) { return !t['in']; });
  }

  function activeFor(state, sid) {
    var a = state.trips.filter(function (t) { return t.sid === sid && !t['in']; });
    return a.length ? a[a.length - 1] : null;
  }

  function canStart(state, sid) {
    if (activeFor(state, sid)) return { ok: false, why: 'already-out' };
    if (state.maxOut > 0 && activeTrips(state).length >= state.maxOut) {
      return { ok: false, why: 'at-limit' };
    }
    return { ok: true };
  }

  function startTrip(state, sid, dest, now) {
    var gate = canStart(state, sid);
    if (!gate.ok) return { state: state, trip: null, error: gate.why };
    var student = state.roster.filter(function (s) { return s.id === sid; })[0];
    if (!student) return { state: state, trip: null, error: 'no-student' };
    var trip = {
      id: uid(),
      sid: sid,
      name: student.name,
      dest: dest || (state.useDest ? state.destinations[0] : 'Bathroom'),
      out: now,
      'in': null
    };
    state.trips.push(trip);
    return { state: state, trip: trip, error: null };
  }

  function endTrip(state, tripId, now) {
    var t = state.trips.filter(function (x) { return x.id === tripId; })[0];
    if (!t || t['in']) return { state: state, trip: null, error: 'not-open' };
    t['in'] = Math.max(now, t.out);
    return { state: state, trip: t, error: null };
  }

  function removeTrip(state, tripId) {
    state.trips = state.trips.filter(function (t) { return t.id !== tripId; });
    return state;
  }

  function duration(trip, now) {
    var end = trip['in'] || now;
    return Math.max(0, end - trip.out);
  }

  /* ---------- formatting ---------- */

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function clock(ms) {
    var s = Math.floor(ms / 1000);
    var m = Math.floor(s / 60);
    return m + ':' + pad(s % 60);
  }

  function minutes(ms) {
    return Math.round(ms / 60000 * 10) / 10;
  }

  function humanMin(ms) {
    var m = minutes(ms);
    return (Math.round(m) === m ? m : m.toFixed(1)) + ' min';
  }

  function timeOfDay(ts) {
    var d = new Date(ts);
    var h = d.getHours();
    var ap = h >= 12 ? 'PM' : 'AM';
    var h12 = h % 12 === 0 ? 12 : h % 12;
    return h12 + ':' + pad(d.getMinutes()) + ' ' + ap;
  }

  function dateKey(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function dateLabel(ts) {
    var d = new Date(ts);
    var days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var mons = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return days[d.getDay()] + ' ' + mons[d.getMonth()] + ' ' + d.getDate();
  }

  function startOfDay(ts) {
    var d = new Date(ts);
    d.setHours(0, 0, 0, 0);
    return d.getTime();
  }

  /* ---------- reporting ---------- */

  /* range: 'today' | 'week' | 'month' | 'all' */
  function inRange(trip, range, now) {
    if (range === 'all') return true;
    var days = range === 'today' ? 1 : (range === 'week' ? 7 : 30);
    return trip.out >= startOfDay(now) - (days - 1) * 86400000;
  }

  function filterTrips(state, range, now) {
    return state.trips.filter(function (t) { return inRange(t, range, now); });
  }

  function perStudent(state, range, now) {
    var trips = filterTrips(state, range, now);
    var rows = state.roster.map(function (s) {
      var mine = trips.filter(function (t) { return t.sid === s.id; });
      var total = mine.reduce(function (a, t) { return a + duration(t, now); }, 0);
      var longest = mine.reduce(function (a, t) {
        return Math.max(a, duration(t, now));
      }, 0);
      return {
        sid: s.id,
        name: s.name,
        trips: mine.length,
        totalMs: total,
        longestMs: longest,
        avgMs: mine.length ? total / mine.length : 0
      };
    });
    rows.sort(function (a, b) {
      return b.trips - a.trips || b.totalMs - a.totalMs || a.name.localeCompare(b.name);
    });
    return rows;
  }

  /* Trips per class-hour, 7am through 4pm - where the day actually leaks time. */
  function byHour(state, range, now) {
    var buckets = [];
    for (var h = 7; h <= 16; h++) buckets.push({ hour: h, count: 0 });
    filterTrips(state, range, now).forEach(function (t) {
      var h = new Date(t.out).getHours();
      if (h < 7) h = 7;
      if (h > 16) h = 16;
      buckets[h - 7].count++;
    });
    return buckets;
  }

  function byWeekday(state, range, now) {
    var names = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var buckets = names.map(function (n) { return { day: n, count: 0 }; });
    filterTrips(state, range, now).forEach(function (t) {
      buckets[new Date(t.out).getDay()].count++;
    });
    return buckets.slice(1, 6); // school week only
  }

  function byDay(state, range, now) {
    var map = {};
    filterTrips(state, range, now).forEach(function (t) {
      var k = dateKey(t.out);
      if (!map[k]) map[k] = { key: k, ts: startOfDay(t.out), count: 0, totalMs: 0 };
      map[k].count++;
      map[k].totalMs += duration(t, now);
    });
    return Object.keys(map).map(function (k) { return map[k]; })
      .sort(function (a, b) { return b.ts - a.ts; });
  }

  function summary(state, range, now) {
    var trips = filterTrips(state, range, now);
    var total = trips.reduce(function (a, t) { return a + duration(t, now); }, 0);
    var days = byDay(state, range, now).length || 1;
    return {
      trips: trips.length,
      totalMs: total,
      avgMs: trips.length ? total / trips.length : 0,
      perDay: Math.round(trips.length / days * 10) / 10,
      days: days
    };
  }

  /* ---------- export ---------- */

  function csvCell(v) {
    var s = String(v == null ? '' : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function toCSV(state, range, now) {
    var head = ['Class', 'Student', 'Destination', 'Date', 'Out', 'In', 'Minutes'];
    var rows = filterTrips(state, range, now)
      .slice()
      .sort(function (a, b) { return a.out - b.out; })
      .map(function (t) {
        return [
          state.className,
          t.name,
          t.dest,
          dateKey(t.out),
          timeOfDay(t.out),
          t['in'] ? timeOfDay(t['in']) : '(not returned)',
          t['in'] ? minutes(duration(t, now)) : ''
        ].map(csvCell).join(',');
      });
    return [head.join(',')].concat(rows).join('\n');
  }

  return {
    KEY: KEY,
    VERSION: VERSION,
    uid: uid,
    blankState: blankState,
    blankStore: blankStore,
    blankClass: blankClass,
    migrate: migrate,
    load: load,
    save: save,
    viewOf: viewOf,
    commit: commit,
    classById: classById,
    activeClass: activeClass,
    addClass: addClass,
    removeClass: removeClass,
    switchClass: switchClass,
    openCount: openCount,
    namesFromTable: namesFromTable,
    parseRoster: parseRoster,
    mergeRoster: mergeRoster,
    rosterText: rosterText,
    activeTrips: activeTrips,
    activeFor: activeFor,
    canStart: canStart,
    startTrip: startTrip,
    endTrip: endTrip,
    removeTrip: removeTrip,
    duration: duration,
    clock: clock,
    minutes: minutes,
    humanMin: humanMin,
    timeOfDay: timeOfDay,
    dateKey: dateKey,
    dateLabel: dateLabel,
    startOfDay: startOfDay,
    filterTrips: filterTrips,
    perStudent: perStudent,
    byHour: byHour,
    byWeekday: byWeekday,
    byDay: byDay,
    summary: summary,
    toCSV: toCSV,
    persistent: persistent
  };
})();

if (typeof module !== 'undefined' && module.exports) module.exports = HP;

</script>
<script>
(function () {
  'use strict';

  var store = HP.load();          // every class on this iPad
  var state = HP.viewOf(store);   // the class on screen right now
  var view = 'board';          // board | teacher
  var tab = 'today';
  var range = 'week';
  var unlocked = false;
  var lastAction = null;       // {type, tripId, at}
  var pinBuf = '';
  var recordSid = '';
  var main = document.getElementById('main');

  function now() { return Date.now(); }
  function persist() { HP.commit(store, state); HP.save(store); }
  function reload() { store = HP.load(); state = HP.viewOf(store); }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  var toastT;
  function toast(msg) {
    var el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    clearTimeout(toastT);
    toastT = setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 2200);
  }

  /* ================= header ================= */

  function renderHeader() {
    var out = HP.activeTrips(state).length;
    document.getElementById('hClass').textContent =
      view === 'teacher' ? 'Teacher view' : (state.className || 'Hall Pass');
    document.getElementById('hSub').textContent =
      view === 'teacher'
        ? (state.className || '') + (state.teacher ? ' - ' + state.teacher : '')
        : HP.dateLabel(now());
    var pill = document.getElementById('hOut');
    if (view === 'board' && out > 0) {
      pill.className = 'pill' + (state.maxOut > 0 && out >= state.maxOut ? ' warn' : '');
      pill.textContent = out + ' out' + (state.maxOut > 0 ? ' of ' + state.maxOut : '');
      pill.classList.remove('hide');
    } else {
      pill.classList.add('hide');
    }
    var many = store.classes.length > 1;
    document.getElementById('hCaret').classList.toggle('hide', !(many && view === 'board' && state.setup));
    document.getElementById('hTeacher').classList.toggle('hide', view !== 'board' || !state.setup);
    document.getElementById('hBack').classList.toggle('hide', view !== 'teacher');
    document.getElementById('tabs').classList.toggle('hide', view !== 'teacher' || !unlocked);
  }

  /* ================= classes ================= */

  /* The teacher who moves rooms taps the class name at the top of the board.
     It sits outside the PIN on purpose: he changes class five times a day and
     should not type four digits each period. */
  function openClassSheet() {
    if (store.classes.length < 2) return;
    var html = '<div class="scrim" id="scrim"><div class="sheet">' +
      '<h2>Which class?</h2>' +
      '<p class="note">Each class keeps its own roster and its own log.</p>';
    store.classes.forEach(function (c) {
      var out = HP.openCount(c);
      html += '<button class="classrow' + (c.id === store.activeId ? ' on' : '') +
        '" data-cls="' + c.id + '"><span><span class="nm">' +
        esc(c.name || 'Untitled class') + '</span><br><span class="meta">' +
        c.roster.length + ' student' + (c.roster.length === 1 ? '' : 's') +
        (out ? ' - ' + out + ' out now' : '') + '</span></span>' +
        (c.id === store.activeId ? '<span class="tick">On screen</span>' : '') +
        '</button>';
    });
    html += '<button class="btn ghost" style="width:100%" id="cxCancel">Cancel</button>' +
      '</div></div>';
    var wrap = document.createElement('div');
    wrap.innerHTML = html;
    var scrim = wrap.firstChild;
    document.body.appendChild(scrim);
    function close() { if (scrim.parentNode) scrim.parentNode.removeChild(scrim); }
    scrim.onclick = function (e) { if (e.target === scrim) close(); };
    document.getElementById('cxCancel').onclick = close;
    Array.prototype.forEach.call(scrim.querySelectorAll('[data-cls]'), function (b) {
      b.onclick = function () {
        close();
        useClass(b.getAttribute('data-cls'));
      };
    });
  }

  function useClass(id) {
    if (id === store.activeId) return;
    persist();                       // whatever is on screen belongs to the old class
    HP.switchClass(store, id);
    HP.save(store);
    state = HP.viewOf(store);
    lastAction = null;
    recordSid = '';
    render();
    toast('Now showing ' + (state.className || 'this class'));
  }

  /* ================= roster import ================= */

  /* A file picker plus a tidy-up button, wired to one roster textarea.
     Nothing is saved by either: both drop names into the box for review. */
  function importControls(id) {
    return '<div class="row" style="margin:-6px 0 14px">' +
      '<button class="btn" id="' + id + 'Imp">Import from a spreadsheet</button>' +
      '<button class="btn ghost" id="' + id + 'Tidy">Tidy a pasted list</button>' +
      '</div>' +
      '<input type="file" id="' + id + 'File" accept=".csv,.tsv,.txt,text/csv,text/plain" class="hide">' +
      '<div class="note hide" id="' + id + 'Note"></div>';
  }

  function wireImport(id, boxId) {
    var box = document.getElementById(boxId);
    var file = document.getElementById(id + 'File');
    var note = document.getElementById(id + 'Note');

    function say(msg) {
      note.innerHTML = msg;
      note.classList.remove('hide');
    }
    function apply(text, from) {
      var names = HP.namesFromTable(text);
      if (!names.length) {
        say('No names found in that ' + from + '. The file should have one student '
          + 'per row - a Name column, or First and Last columns.');
        return;
      }
      box.value = names.join('\n');
      say('Found <strong>' + names.length + ' name' + (names.length === 1 ? '' : 's') +
        '</strong>. Check the list, fix anything that came out wrong, then Save.');
      toast(names.length + ' names read');
    }

    document.getElementById(id + 'Imp').onclick = function () { file.click(); };
    file.onchange = function () {
      var f = file.files && file.files[0];
      if (!f) return;
      if (/\.(xlsx|xls|numbers|ods)$/i.test(f.name)) {
        say('<strong>' + esc(f.name) + '</strong> is a spreadsheet file, which this page '
          + 'cannot open. In Excel choose File, Save As, <strong>CSV</strong>; in Google '
          + 'Sheets choose File, Download, <strong>Comma separated values</strong>; in '
          + 'Numbers choose File, Export To, CSV. Then import that file.');
        file.value = '';
        return;
      }
      var r = new FileReader();
      r.onload = function () { apply(String(r.result || ''), 'file'); file.value = ''; };
      r.onerror = function () { say('That file could not be read.'); file.value = ''; };
      r.readAsText(f);
    };
    document.getElementById(id + 'Tidy').onclick = function () {
      if (!box.value.trim()) return say('Paste the list into the box first, then tap this.');
      apply(box.value, 'list');
    };
  }

  /* ================= setup ================= */

  function renderSetup() {
    main.innerHTML =
      '<div class="panel" style="max-width:560px;margin:0 auto">' +
      '<h3 style="font-size:19px">Set up this iPad</h3>' +
      '<p class="muted small" style="margin-top:-6px">One time. Everything stays on this device - nothing is uploaded anywhere.</p>' +
      '<label class="field"><span>Class name</span>' +
      '<input type="text" id="sClass" placeholder="Third Grade B" value="' + esc(state.className) + '"></label>' +
      '<label class="field"><span>Teacher (optional)</span>' +
      '<input type="text" id="sTeacher" placeholder="Ms. Diana" value="' + esc(state.teacher) + '"></label>' +
      '<label class="field"><span>Students - one name per line</span>' +
      '<textarea id="sRoster" placeholder="Ava Martinez&#10;Ben Cole&#10;Chloe Adams">' + esc(HP.rosterText(state.roster)) + '</textarea></label>' +
      importControls('su') +
      '<p class="muted small" style="margin-top:-4px">Teaching more than one class? Add the rest later in Teacher, Settings, Classes.</p>' +
      '<label class="field"><span>Teacher PIN - 4 digits, keeps students out of the reports</span>' +
      '<input type="tel" id="sPin" maxlength="4" inputmode="numeric" placeholder="1234" value="' + esc(state.pin) + '"></label>' +
      '<button class="btn primary" id="sGo" style="width:100%;padding:14px">Start</button>' +
      '</div>';
    wireImport('su', 'sRoster');
    document.getElementById('sGo').onclick = function () {
      var cls = document.getElementById('sClass').value.trim();
      var roster = HP.mergeRoster(state.roster, document.getElementById('sRoster').value);
      var pin = document.getElementById('sPin').value.replace(/\D/g, '');
      if (!cls) return toast('Add a class name');
      if (!roster.length) return toast('Add at least one student');
      if (pin.length !== 4) return toast('PIN must be 4 digits');
      state.className = cls;
      state.teacher = document.getElementById('sTeacher').value.trim();
      state.roster = roster;
      state.pin = pin;
      state.setup = true;
      persist();
      render();
    };
  }

  /* ================= board ================= */

  function renderBoard() {
    var active = HP.activeTrips(state);
    var atLimit = state.maxOut > 0 && active.length >= state.maxOut;
    if (!state.roster.length) {
      main.innerHTML = '<div class="empty">No students yet. Open Teacher, then Settings.</div>';
      return;
    }
    var html = '<div id="grid">';
    state.roster.forEach(function (s) {
      var t = HP.activeFor(state, s.id);
      var cls = 'tile';
      var body;
      if (t) {
        var ms = HP.duration(t, now());
        var over = ms > state.longTripMin * 60000;
        cls += over ? ' out over' : ' out';
        body = '<div class="timer" data-timer="' + t.id + '">' + HP.clock(ms) + '</div>' +
               '<div class="st">' + esc(t.dest) + ' - tap to return</div>';
      } else {
        if (atLimit) cls += ' blocked';
        body = '<div class="st">' + (atLimit ? 'Wait - class is at the limit' : 'Tap to sign out') + '</div>';
      }
      html += '<button class="' + cls + '" data-sid="' + s.id + '">' +
              '<div class="nm">' + esc(s.name) + '</div>' + body + '</button>';
    });
    html += '</div>';
    main.innerHTML = html;
    Array.prototype.forEach.call(main.querySelectorAll('[data-sid]'), function (el) {
      el.onclick = function () { tapStudent(el.getAttribute('data-sid')); };
    });
    renderUndo();
  }

  function tapStudent(sid) {
    var open = HP.activeFor(state, sid);
    if (open) {
      HP.endTrip(state, open.id, now());
      persist();
      lastAction = { type: 'end', tripId: open.id, at: now() };
      render();
      return;
    }
    var gate = HP.canStart(state, sid);
    if (!gate.ok) {
      toast(gate.why === 'at-limit'
        ? 'Someone is already out. Wait for them to come back.'
        : 'Already signed out.');
      return;
    }
    if (state.useDest && state.destinations.length > 1) {
      askDestination(sid);
    } else {
      doStart(sid, state.useDest ? state.destinations[0] : 'Bathroom');
    }
  }

  function doStart(sid, dest) {
    var r = HP.startTrip(state, sid, dest, now());
    if (r.error) return toast('Could not sign out');
    persist();
    lastAction = { type: 'start', tripId: r.trip.id, at: now() };
    render();
  }

  function askDestination(sid) {
    var html = '<div class="scrim" id="scrim"><div class="sheet">' +
      '<h2>Where to?</h2><p class="note">Tap one.</p><div class="destgrid">';
    state.destinations.forEach(function (d, i) {
      html += '<button data-d="' + i + '">' + esc(d) + '</button>';
    });
    html += '</div><button class="btn ghost" style="width:100%" id="dCancel">Cancel</button></div></div>';
    var wrap = document.createElement('div');
    wrap.innerHTML = html;
    document.body.appendChild(wrap.firstChild);
    var scrim = document.getElementById('scrim');
    function close() { if (scrim.parentNode) scrim.parentNode.removeChild(scrim); }
    scrim.onclick = function (e) { if (e.target === scrim) close(); };
    document.getElementById('dCancel').onclick = close;
    Array.prototype.forEach.call(scrim.querySelectorAll('[data-d]'), function (b) {
      b.onclick = function () {
        close();
        doStart(sid, state.destinations[+b.getAttribute('data-d')]);
      };
    });
  }

  function renderUndo() {
    var bar = document.getElementById('undo');
    var fresh = lastAction && (now() - lastAction.at) < 20000;
    if (!fresh) {
      if (bar) bar.parentNode.removeChild(bar);
      return;
    }
    var trip = state.trips.filter(function (t) { return t.id === lastAction.tripId; })[0];
    if (!trip) return;
    var label = lastAction.type === 'start'
      ? esc(trip.name) + ' signed out'
      : esc(trip.name) + ' came back';
    if (!bar) {
      bar = document.createElement('div');
      bar.id = 'undo';
      document.body.appendChild(bar);
    }
    bar.innerHTML = '<span>' + label + '</span><button id="undoBtn">Undo</button>';
    document.getElementById('undoBtn').onclick = function () {
      if (lastAction.type === 'start') HP.removeTrip(state, lastAction.tripId);
      else if (trip) trip['in'] = null;
      lastAction = null;
      persist();
      render();
    };
  }

  /* ================= teacher: lock ================= */

  function renderLock() {
    main.innerHTML =
      '<div class="panel" style="max-width:320px;margin:24px auto;text-align:center">' +
      '<h3 style="font-size:17px">Teacher PIN</h3>' +
      '<div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>' +
      '<div class="keypad" id="keypad">' +
      [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (n) {
        return '<button data-k="' + n + '">' + n + '</button>';
      }).join('') +
      '<button data-k="del">del</button><button data-k="0">0</button>' +
      '<button data-k="clr">clr</button></div></div>';
    function paint() {
      var dots = document.getElementById('dots').children;
      for (var i = 0; i < 4; i++) dots[i].className = i < pinBuf.length ? 'on' : '';
    }
    Array.prototype.forEach.call(main.querySelectorAll('[data-k]'), function (b) {
      b.onclick = function () {
        var k = b.getAttribute('data-k');
        if (k === 'del') pinBuf = pinBuf.slice(0, -1);
        else if (k === 'clr') pinBuf = '';
        else if (pinBuf.length < 4) pinBuf += k;
        paint();
        if (pinBuf.length === 4) {
          if (pinBuf === state.pin) {
            unlocked = true; pinBuf = ''; render();
          } else {
            pinBuf = ''; paint(); toast('Wrong PIN');
          }
        }
      };
    });
    paint();
  }

  /* ================= teacher: tabs ================= */

  function rangePicker() {
    var opts = [['today', 'Today'], ['week', 'Last 7 days'], ['month', 'Last 30 days'], ['all', 'All time']];
    return '<select id="rangeSel" style="max-width:200px;margin-bottom:14px">' +
      opts.map(function (o) {
        return '<option value="' + o[0] + '"' + (range === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
      }).join('') + '</select>';
  }

  function wireRange() {
    var sel = document.getElementById('rangeSel');
    if (sel) sel.onchange = function () { range = sel.value; render(); };
  }

  function renderToday() {
    var t0 = HP.startOfDay(now());
    var trips = state.trips.filter(function (t) { return t.out >= t0; })
      .slice().sort(function (a, b) { return b.out - a.out; });
    var open = HP.activeTrips(state);
    var total = trips.reduce(function (a, t) { return a + HP.duration(t, now()); }, 0);
    var html = '<div class="cards">' +
      stat('Trips today', trips.length) +
      stat('Time out', HP.humanMin(total)) +
      stat('Out right now', open.length) +
      '</div>';

    if (open.length) {
      html += '<div class="panel"><h3>Out right now</h3><table><tbody>' +
        open.map(function (t) {
          var ms = HP.duration(t, now());
          var over = ms > state.longTripMin * 60000;
          return '<tr><td>' + esc(t.name) + '</td><td class="small muted">' + esc(t.dest) + '</td>' +
            '<td class="num' + (over ? ' flag' : '') + '">' + HP.clock(ms) + '</td>' +
            '<td class="num"><button class="btn ghost small" data-close="' + t.id + '">Return</button></td></tr>';
        }).join('') + '</tbody></table></div>';
    }

    html += '<div class="panel"><h3>Today\'s log</h3>';
    if (!trips.length) {
      html += '<p class="muted small">Nothing yet today.</p>';
    } else {
      html += '<table><thead><tr><th>Student</th><th>Out</th><th>In</th>' +
        '<th class="num">Min</th><th></th></tr></thead><tbody>' +
        trips.map(function (t) {
          var ms = HP.duration(t, now());
          var over = ms > state.longTripMin * 60000;
          return '<tr><td>' + esc(t.name) +
            (state.useDest ? ' <span class="muted small">' + esc(t.dest) + '</span>' : '') + '</td>' +
            '<td class="small">' + HP.timeOfDay(t.out) + '</td>' +
            '<td class="small">' + (t['in'] ? HP.timeOfDay(t['in']) : '<span class="muted">out</span>') + '</td>' +
            '<td class="num' + (over ? ' flag' : '') + '">' + HP.minutes(ms) + '</td>' +
            '<td class="num"><button class="btn ghost small" data-del="' + t.id + '">Delete</button></td></tr>';
        }).join('') + '</tbody></table>';
    }
    html += '</div>';
    main.innerHTML = html;
    wireRowButtons();
  }

  function wireRowButtons() {
    Array.prototype.forEach.call(main.querySelectorAll('[data-close]'), function (b) {
      b.onclick = function () {
        HP.endTrip(state, b.getAttribute('data-close'), now());
        persist(); render();
      };
    });
    Array.prototype.forEach.call(main.querySelectorAll('[data-del]'), function (b) {
      b.onclick = function () {
        if (!confirm('Delete this entry?')) return;
        HP.removeTrip(state, b.getAttribute('data-del'));
        persist(); render();
      };
    });
  }

  function stat(k, v) {
    return '<div class="stat"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div></div>';
  }

  function renderStudents() {
    var rows = HP.perStudent(state, range, now());
    var s = HP.summary(state, range, now());
    var maxTrips = rows.reduce(function (a, r) { return Math.max(a, r.trips); }, 0) || 1;
    var html = rangePicker() +
      '<div class="cards">' +
      stat('Trips', s.trips) +
      stat('Average trip', s.trips ? HP.humanMin(s.avgMs) : '-') +
      stat('Trips per day', s.perDay) +
      '</div>' +
      '<div class="panel"><h3>By student</h3><table><thead><tr>' +
      '<th>Student</th><th class="num">Trips</th><th></th>' +
      '<th class="num">Total min</th><th class="num">Longest min</th></tr></thead><tbody>' +
      rows.map(function (r) {
        var w = Math.round(r.trips / maxTrips * 100);
        return '<tr><td>' + esc(r.name) + '</td>' +
          '<td class="num">' + r.trips + '</td>' +
          '<td style="width:34%"><div class="barwrap"><div class="bar" style="width:' + w + '%"></div></div></td>' +
          '<td class="num">' + (r.trips ? HP.minutes(r.totalMs) : 0) + '</td>' +
          '<td class="num">' + (r.trips ? HP.minutes(r.longestMs) : 0) + '</td></tr>';
      }).join('') +
      '</tbody></table><p class="muted small" style="margin-bottom:0">A high count is a conversation starter, not a verdict.</p></div>';
    main.innerHTML = html;
    wireRange();
  }

  function chart(title, buckets, labelKey) {
    var max = buckets.reduce(function (a, b) { return Math.max(a, b.count); }, 0) || 1;
    return '<div class="panel"><h3>' + esc(title) + '</h3><table><tbody>' +
      buckets.map(function (b) {
        var lab = labelKey === 'hour'
          ? ((b.hour % 12 === 0 ? 12 : b.hour % 12) + (b.hour < 12 ? 'am' : 'pm'))
          : b[labelKey];
        return '<tr><td style="width:70px" class="small">' + esc(lab) + '</td>' +
          '<td><div class="barwrap"><div class="bar" style="width:' +
          Math.round(b.count / max * 100) + '%"></div></div></td>' +
          '<td class="num" style="width:44px">' + b.count + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  function renderPatterns() {
    var days = HP.byDay(state, range, now());
    var html = rangePicker() +
      chart('Time of day', HP.byHour(state, range, now()), 'hour') +
      chart('Day of week', HP.byWeekday(state, range, now()), 'day') +
      '<div class="panel"><h3>By day</h3>';
    if (!days.length) html += '<p class="muted small">No trips in this range.</p>';
    else {
      html += '<table><thead><tr><th>Day</th><th class="num">Trips</th><th class="num">Minutes</th></tr></thead><tbody>' +
        days.map(function (d) {
          return '<tr><td>' + HP.dateLabel(d.ts) + '</td><td class="num">' + d.count +
            '</td><td class="num">' + HP.minutes(d.totalMs) + '</td></tr>';
        }).join('') + '</tbody></table>';
    }
    html += '</div>';
    main.innerHTML = html;
    wireRange();
  }

  /* ---- printable conference record ---------------------------------- */

  function reportHTML(sid, range) {
    var t0 = now();
    var label = { today: 'Today', week: 'Last 7 days', month: 'Last 30 days',
                  all: 'All recorded days' }[range];
    var trips = HP.filterTrips(state, range, t0)
      .filter(function (t) { return !sid || t.sid === sid; })
      .sort(function (a, b) { return a.out - b.out; });
    var who = sid
      ? (state.roster.filter(function (x) { return x.id === sid; })[0] || {}).name
      : 'Whole class';
    var total = trips.reduce(function (a, t) { return a + HP.duration(t, t0); }, 0);
    var longest = trips.reduce(function (a, t) {
      return Math.max(a, HP.duration(t, t0));
    }, 0);
    var days = HP.byDay(state, range, t0).length || 1;
    var classRows = HP.perStudent(state, range, t0);
    var classTrips = classRows.reduce(function (a, r) { return a + r.trips; }, 0);
    var classAvg = state.roster.length
      ? Math.round(classTrips / state.roster.length * 10) / 10 : 0;
    var logo = document.getElementById('hLogo').getAttribute('src');

    function row(t) {
      var ms = HP.duration(t, t0);
      var over = ms > state.longTripMin * 60000;
      return '<tr><td>' + HP.dateLabel(t.out) + '</td>' +
        (sid ? '' : '<td>' + esc(t.name) + '</td>') +
        '<td>' + HP.timeOfDay(t.out) + '</td>' +
        '<td>' + (t['in'] ? HP.timeOfDay(t['in']) : 'not returned') + '</td>' +
        '<td class="n' + (over ? ' over' : '') + '">' + HP.minutes(ms) + '</td>' +
        '<td>' + esc(t.dest) + '</td></tr>';
    }

    return '<!doctype html><html><head><meta charset="utf-8">' +
      '<title>Hall pass record - ' + esc(who) + '</title><style>' +
      'body{font:13px/1.5 "Poppins",-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;' +
      'color:#1f2937;margin:0;padding:38px 42px;background:#fff}' +
      '.lh{display:flex;align-items:center;gap:16px;border-bottom:3px solid #a7beb1;padding-bottom:14px}' +
      '.lh img{height:52px}.lh .s{font-size:17px;font-weight:600;color:#2a353c}' +
      '.lh .t{font-size:12px;color:#71808d}' +
      'h1{font-size:20px;margin:22px 0 4px;color:#2a353c}' +
      '.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 28px;margin:14px 0 22px;font-size:12.5px}' +
      '.meta b{color:#71808d;font-weight:600}' +
      '.cards{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}' +
      '.c{border:1px solid #dde5ec;border-radius:10px;padding:9px 14px;min-width:104px}' +
      '.c .k{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#71808d;font-weight:600}' +
      '.c .v{font-size:19px;font-weight:600}' +
      'table{width:100%;border-collapse:collapse;font-size:12.5px}' +
      'th{text-align:left;background:#f5f1e3;padding:7px 8px;font-size:10.5px;' +
      'text-transform:uppercase;letter-spacing:.05em;color:#5a6672}' +
      'td{padding:6px 8px;border-bottom:1px solid #eef2f6}' +
      'td.n{text-align:right}td.over{color:#b8433c;font-weight:600}' +
      '.notes{margin-top:26px}.notes .ln{border-bottom:1px solid #c9d4dd;height:26px}' +
      '.sig{display:flex;gap:34px;margin-top:30px;font-size:11.5px;color:#71808d}' +
      '.sig div{flex:1;border-top:1px solid #2a353c;padding-top:5px}' +
      '.foot{margin-top:26px;font-size:10.5px;color:#8b98a4;border-top:1px solid #eef2f6;padding-top:10px}' +
      '@media print{body{padding:0}.notes{page-break-inside:avoid}}' +
      '</style></head><body>' +
      '<div class="lh"><img src="' + logo + '" alt="">' +
      '<div><div class="s">' + esc(state.schoolName) + '</div>' +
      '<div class="t">Hall pass record - for teacher and family conferences</div></div></div>' +
      '<h1>' + esc(who) + '</h1>' +
      '<div class="meta">' +
      '<div><b>Class</b> ' + esc(state.className) + '</div>' +
      '<div><b>Teacher</b> ' + esc(state.teacher || '-') + '</div>' +
      '<div><b>Period covered</b> ' + label + '</div>' +
      '<div><b>Prepared</b> ' + HP.dateLabel(t0) + ', ' + HP.timeOfDay(t0) + '</div>' +
      '</div>' +
      '<div class="cards">' +
      '<div class="c"><div class="k">Trips</div><div class="v">' + trips.length + '</div></div>' +
      '<div class="c"><div class="k">Total time out</div><div class="v">' + HP.minutes(total) + ' min</div></div>' +
      '<div class="c"><div class="k">Average trip</div><div class="v">' +
      (trips.length ? HP.minutes(total / trips.length) : 0) + ' min</div></div>' +
      '<div class="c"><div class="k">Longest trip</div><div class="v">' + HP.minutes(longest) + ' min</div></div>' +
      '<div class="c"><div class="k">School days</div><div class="v">' + days + '</div></div>' +
      (sid ? '<div class="c"><div class="k">Class average</div><div class="v">' +
        classAvg + ' trips</div></div>' : '') +
      '</div>' +
      (trips.length
        ? '<table><thead><tr><th>Date</th>' + (sid ? '' : '<th>Student</th>') +
          '<th>Out</th><th>In</th><th style="text-align:right">Minutes</th><th>Destination</th>' +
          '</tr></thead><tbody>' + trips.map(row).join('') + '</tbody></table>'
        : '<p>No trips recorded in this period.</p>') +
      '<div class="notes"><b>Notes</b>' +
      '<div class="ln"></div><div class="ln"></div><div class="ln"></div><div class="ln"></div></div>' +
      '<div class="sig"><div>Teacher signature</div><div>Family signature</div><div>Date</div></div>' +
      '<div class="foot">Times are recorded by tap on the classroom iPad and may be a ' +
      'minute off either side. Counts describe time out of the room; they do not by ' +
      'themselves explain why. Any medical reason should be discussed with the family ' +
      'and the office.</div>' +
      '</body></html>';
  }

  function download(name, text, mime) {
    var blob = new Blob([text], { type: mime });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  }

  function renderRecords() {
    var sel = recordSid;
    main.innerHTML = rangePicker() +
      '<div class="panel"><h3>Conference record</h3>' +
      '<p class="muted small">A one-page printable record for a running record or a ' +
      'family conference: the summary, every trip with times, and space for notes ' +
      'and signatures. Built on this iPad - nothing is sent anywhere.</p>' +
      '<label class="field"><span>Who</span><select id="rStudent">' +
      '<option value="">Whole class</option>' +
      state.roster.map(function (st) {
        return '<option value="' + st.id + '"' + (sel === st.id ? ' selected' : '') +
          '>' + esc(st.name) + '</option>';
      }).join('') + '</select></label>' +
      '<div class="row"><button class="btn primary" id="rPrint">Print or save as PDF</button>' +
      '<button class="btn" id="rDown">Download the record</button></div></div>' +
      '<div class="panel"><h3>Preview</h3>' +
      '<iframe id="rFrame" style="width:100%;height:520px;border:1px solid var(--line);' +
      'border-radius:12px;background:#fff"></iframe></div>' +
      '<div class="panel"><h3>Spreadsheet</h3>' +
      '<p class="muted small">Every trip as CSV, for Numbers, Excel or Google Sheets.</p>' +
      '<div class="row"><button class="btn" id="xDl">Download CSV</button>' +
      '<button class="btn" id="xCopy">Copy to clipboard</button></div></div>';
    wireRange();

    function html() { return reportHTML(recordSid, range); }
    function paint() {
      var f = document.getElementById('rFrame');
      f.srcdoc = html();
    }
    document.getElementById('rStudent').onchange = function () {
      recordSid = this.value;
      paint();
    };
    paint();

    var base = (state.className || 'class').replace(/[^\w-]+/g, '_');
    document.getElementById('rPrint').onclick = function () {
      var f = document.getElementById('rFrame');
      f.contentWindow.focus();
      f.contentWindow.print();
    };
    document.getElementById('rDown').onclick = function () {
      var who = recordSid
        ? (state.roster.filter(function (x) { return x.id === recordSid; })[0] || {}).name
        : 'class';
      download(base + '_' + String(who).replace(/[^\w-]+/g, '_') + '_hallpass_' +
        HP.dateKey(now()) + '.html', html(), 'text/html');
    };
    document.getElementById('xDl').onclick = function () {
      download(base + '_hallpass_' + HP.dateKey(now()) + '.csv',
        HP.toCSV(state, range, now()), 'text/csv');
    };
    document.getElementById('xCopy').onclick = function () {
      var csv = HP.toCSV(state, range, now());
      if (navigator.clipboard) navigator.clipboard.writeText(csv);
      toast('Copied');
    };
  }

  function renderSettings() {
    main.innerHTML =
      '<div class="panel"><h3>Class</h3>' +
      '<label class="field"><span>School</span><input type="text" id="cSchool" value="' +
      esc(state.schoolName) + '"></label>' +
      '<label class="field"><span>Class name</span><input type="text" id="cClass" value="' + esc(state.className) + '"></label>' +
      '<label class="field"><span>Teacher</span><input type="text" id="cTeacher" value="' + esc(state.teacher) + '"></label>' +
      '<label class="field"><span>Students - one name per line. Editing a name keeps its history; removing a name hides it but keeps past entries.</span>' +
      '<textarea id="cRoster">' + esc(HP.rosterText(state.roster)) + '</textarea></label>' +
      importControls('st') +
      '</div>' +
      classesPanel() +
      '<div class="panel"><h3>Rules</h3>' +
      '<label class="field"><span>How many students may be out at once (0 = no limit)</span>' +
      '<input type="number" id="cMax" min="0" max="10" value="' + state.maxOut + '"></label>' +
      '<label class="field"><span>Flag a trip longer than (minutes)</span>' +
      '<input type="number" id="cLong" min="1" max="60" value="' + state.longTripMin + '"></label>' +
      '<div class="switch"><input type="checkbox" id="cUseDest"' + (state.useDest ? ' checked' : '') + '>' +
      '<span>Ask where they are going</span></div>' +
      '<label class="field"><span>Destinations, comma separated</span>' +
      '<input type="text" id="cDest" value="' + esc(state.destinations.join(', ')) + '"></label>' +
      '<label class="field"><span>Teacher PIN (4 digits)</span>' +
      '<input type="tel" id="cPin" maxlength="4" inputmode="numeric" value="' + esc(state.pin) + '"></label>' +
      '<button class="btn primary" id="cSave" style="width:100%">Save settings</button></div>' +
      '<div class="panel"><h3>Data</h3>' +
      '<p class="muted small">Everything lives on this iPad only. Export first if you want to keep it.</p>' +
      '<div class="row"><button class="btn danger" id="cWipeTrips">Clear this class\'s history</button>' +
      '<button class="btn danger" id="cWipeAll">Reset this iPad</button></div></div>';

    wireImport('st', 'cRoster');
    wireClassesPanel();
    document.getElementById('cSave').onclick = function () {
      var pin = document.getElementById('cPin').value.replace(/\D/g, '');
      if (pin.length !== 4) return toast('PIN must be 4 digits');
      state.className = document.getElementById('cClass').value.trim() || state.className;
      state.schoolName = document.getElementById('cSchool').value.trim();
      state.teacher = document.getElementById('cTeacher').value.trim();
      state.roster = HP.mergeRoster(state.roster, document.getElementById('cRoster').value);
      state.maxOut = Math.max(0, parseInt(document.getElementById('cMax').value, 10) || 0);
      state.longTripMin = Math.max(1, parseInt(document.getElementById('cLong').value, 10) || 10);
      state.useDest = document.getElementById('cUseDest').checked;
      var d = document.getElementById('cDest').value.split(',').map(function (x) { return x.trim(); })
        .filter(Boolean);
      if (d.length) state.destinations = d;
      persist();
      toast('Saved');
      render();
    };
    document.getElementById('cWipeTrips').onclick = function () {
      if (!confirm('Delete every trip for ' + (state.className || 'this class') +
                   '? Other classes keep theirs. Export first if you need the data.')) return;
      state.trips = [];
      persist(); render();
    };
    document.getElementById('cWipeAll').onclick = function () {
      if (!confirm('Erase every class, every roster and all history on this iPad?')) return;
      store = HP.migrate(HP.blankStore());
      state = HP.viewOf(store);
      HP.save(store);
      unlocked = false; view = 'board'; render();
    };
  }

  /* ---------- classes, inside Settings ---------- */

  function classesPanel() {
    var html = '<div class="panel"><h3>Classes</h3>' +
      '<p class="muted small">One roster and one log each. On the board, tap the ' +
      'class name at the top to switch - no PIN needed.</p>';
    store.classes.forEach(function (c) {
      var on = c.id === store.activeId;
      html += '<div class="classline"><div class="grow"><div class="nm">' +
        esc(c.name || 'Untitled class') + (on ? ' <span class="muted small">- on screen</span>' : '') +
        '</div><div class="muted small">' + c.roster.length + ' students, ' +
        c.trips.length + ' trip' + (c.trips.length === 1 ? '' : 's') + ' logged</div></div>' +
        (on ? '' : '<button class="btn" data-use="' + c.id + '">Switch to it</button>') +
        (store.classes.length > 1 ? '<button class="btn danger" data-drop="' + c.id + '">Delete</button>' : '') +
        '</div>';
    });
    html += '<label class="field" style="margin-top:14px"><span>Add a class</span>' +
      '<input type="text" id="nClass" placeholder="Period 4 - science"></label>' +
      '<button class="btn primary" id="nAdd" style="width:100%">Add the class</button></div>';
    return html;
  }

  function wireClassesPanel() {
    Array.prototype.forEach.call(main.querySelectorAll('[data-use]'), function (b) {
      b.onclick = function () { useClass(b.getAttribute('data-use')); };
    });
    Array.prototype.forEach.call(main.querySelectorAll('[data-drop]'), function (b) {
      b.onclick = function () {
        var c = HP.classById(store, b.getAttribute('data-drop'));
        if (!c) return;
        if (!confirm('Delete ' + (c.name || 'this class') + ' with its roster and all ' +
                     c.trips.length + ' logged trips? This cannot be undone.')) return;
        HP.removeClass(store, c.id);
        HP.save(store);
        state = HP.viewOf(store);
        render();
        toast('Class deleted');
      };
    });
    document.getElementById('nAdd').onclick = function () {
      var name = document.getElementById('nClass').value.trim();
      if (!name) return toast('Give the class a name');
      persist();                     // keep whatever is already on this screen
      HP.addClass(store, name, []);
      HP.save(store);
      state = HP.viewOf(store);
      render();
      toast('Added ' + name + ' - now add its students');
    };
  }

  /* ================= router ================= */

  function storageNote() {
    var el = document.getElementById('nosave');
    if (!el) return;
    var ok = HP.persistent();
    el.classList.toggle('hide', ok);
    if (!ok) {
      el.textContent = 'This device is not letting the page save. Nothing will be '
        + 'kept when you close it. Open the app from a web address instead of a file, '
        + 'or turn off Settings > Safari > Block All Cookies.';
    }
  }

  function render() {
    renderHeader();
    storageNote();
    if (!state.setup) return renderSetup();
    if (view === 'board') return renderBoard();
    if (!unlocked) return renderLock();
    if (tab === 'today') return renderToday();
    if (tab === 'students') return renderStudents();
    if (tab === 'patterns') return renderPatterns();
    if (tab === 'records') return renderRecords();
    return renderSettings();
  }

  document.getElementById('hClassBtn').onclick = function () {
    if (view === 'board' && state.setup) openClassSheet();
  };
  document.getElementById('hTeacher').onclick = function () {
    view = 'teacher'; tab = 'today'; pinBuf = ''; render();
  };
  document.getElementById('hBack').onclick = function () {
    view = 'board'; unlocked = false; render();
  };
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) {
    b.onclick = function () {
      tab = b.getAttribute('data-tab');
      Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (x) {
        x.classList.toggle('on', x === b);
      });
      render();
    };
  });

  /* live timers - repaint only the digits so a tap is never eaten mid-render */
  setInterval(function () {
    if (view === 'board') {
      var open = HP.activeTrips(state);
      var stale = false;
      open.forEach(function (t) {
        var el = main.querySelector('[data-timer="' + t.id + '"]');
        if (!el) { stale = true; return; }
        var ms = HP.duration(t, now());
        el.textContent = HP.clock(ms);
        var tile = el.closest ? el.closest('.tile') : null;
        if (tile && ms > state.longTripMin * 60000) tile.classList.add('over');
      });
      if (stale) render();
      renderUndo();
    } else if (view === 'teacher' && unlocked && tab === 'today' && HP.activeTrips(state).length) {
      renderToday();
    }
  }, 1000);

  /* a second tab or a reopened app should not show stale data */
  window.addEventListener('storage', function (e) {
    if (e.key === HP.KEY) { reload(); render(); }
  });
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { reload(); render(); }
  });

  render();
  window.__HP_READY = true;
})();
</script>
</body>
</html>
